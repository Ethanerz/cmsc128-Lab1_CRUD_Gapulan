<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
	<h1>To-Do List</h1>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
    {% endwith %}
    <nav>
        {% if session.get('user_id') %}
            <p class="nav-greeting">Hello, {{ session.get('display_name') }}!</p>
            <div class="nav-user">
                <form method="GET" action="{{ url_for('profile') }}">
                    <button type="submit">Profile</button>
                </form>
                <form method="POST" action="{{ url_for('logout') }}">
                    <button type="submit">Log Out</button>
                </form>
            </div>
        {% else %}
            <a href="{{ url_for('login') }}">Log In</a>
            <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
    </nav>
    <p id="task-error" role="alert" hidden></p>
    <p id="list-status" role="status" hidden></p>
    <section aria-labelledby="list-heading">
        <h2 id="list-heading">Your lists</h2>
        <div class="field">
            <label for="list-selector">Current list</label>
            <select id="list-selector" data-current-user-id="{{ session['user_id'] }}">
                <option value="">Personal tasks</option>
            </select>
        </div>
        <form id="list-create-form">
            <label for="list-name">Create a collaborative list</label>
            <input type="text" id="list-name" placeholder="List name" required>
            <button type="submit">Create list</button>
        </form>
        <form id="list-invite-form" hidden>
            <label for="list-invite-identifier">Invite by username or email</label>
            <input type="text" id="list-invite-identifier" placeholder="Username or email" required>
            <button type="submit">Invite user</button>
        </form>
    </section>
    <form id="task-form">
		<input type="text" id="title" placeholder="Task title" required>
		<input type="datetime-local" id="due_datetime" required>
        <select id="priority" required>
            <option value="" disabled selected>Priority</option>
            <option value="Low">Low</option>
            <option value="Med">Med</option>
            <option value="High">High</option>
        </select>
        <select id="tag" required>
            <option value="" disabled selected>Tag</option>
            <option value="School">School</option>
            <option value="Personal">Personal</option>
            <option value="Others">Others</option>
        </select>
        <button type="submit">Add Task</button>
	</form>
	<ul id="task-list">
    </ul>
	<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
